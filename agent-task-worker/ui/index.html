<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Agent Task Console</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #161922;
    --border: #262b38;
    --text: #d7dae2;
    --muted: #7c8394;
    --accent: #5b8def;
    --ok: #3fb968;
    --warn: #e0a83f;
    --err: #e0554f;
    --tag-engine: #5b8def;
    --tag-agent: #e0a83f;
    --tag-mcp: #b072e8;
    --tag-llm: #3fb968;
    --tag-http: #7c8394;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    display: flex;
    flex-direction: column;
    height: 100vh;
  }
  header {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
    background: var(--panel);
  }
  h1 {
    font-size: 15px;
    font-weight: 600;
    margin: 0;
    flex-shrink: 0;
  }
  h1 span { color: var(--muted); font-weight: 400; }
  #start {
    background: var(--accent);
    color: #08101f;
    border: none;
    padding: 8px 18px;
    border-radius: 6px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
  }
  #start:disabled { opacity: 0.5; cursor: default; }
  #start:not(:disabled):hover { filter: brightness(1.1); }
  #status {
    font-size: 12px;
    padding: 4px 10px;
    border-radius: 999px;
    border: 1px solid var(--border);
    color: var(--muted);
  }
  #status.running { color: var(--warn); border-color: var(--warn); }
  #status.completed { color: var(--ok); border-color: var(--ok); }
  #status.failed { color: var(--err); border-color: var(--err); }
  #instance {
    font-size: 12px;
    color: var(--muted);
    font-family: ui-monospace, 'SF Mono', Menlo, monospace;
    margin-left: auto;
  }
  main {
    flex: 1;
    display: flex;
    min-height: 0;
  }
  #log {
    flex: 1;
    overflow-y: auto;
    padding: 14px 20px;
    font-family: ui-monospace, 'SF Mono', Menlo, monospace;
    font-size: 12.5px;
    line-height: 1.6;
    white-space: pre-wrap;
    word-break: break-word;
  }
  #log .line { margin-bottom: 1px; }
  #log .elapsed { color: var(--muted); }
  #log .tag { font-weight: 600; }
  #log .tag-engine { color: var(--tag-engine); }
  #log .tag-agent-task { color: var(--tag-agent); }
  #log .tag-mcp { color: var(--tag-mcp); }
  #log .tag-llm { color: var(--tag-llm); }
  #log .tag-http-tool { color: var(--tag-http); }
  #log .plain { color: var(--muted); }
  #result {
    width: 340px;
    flex-shrink: 0;
    border-left: 1px solid var(--border);
    background: var(--panel);
    padding: 16px 18px;
    overflow-y: auto;
  }
  #result h2 {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--muted);
    margin: 0 0 10px;
  }
  #result-text {
    font-size: 13.5px;
    line-height: 1.5;
    white-space: pre-wrap;
  }
  #result-text.empty { color: var(--muted); font-style: italic; }
</style>
</head>
<body>
  <header>
    <h1>Agent Task Console <span id="key"></span></h1>
    <button id="start">Start Agent</button>
    <span id="status">idle</span>
    <span id="instance"></span>
  </header>
  <main>
    <div id="log"></div>
    <div id="result">
      <h2>Agent Response</h2>
      <div id="result-text" class="empty">Not run yet.</div>
    </div>
  </main>

<script>
  document.getElementById('key').textContent = '— fx-rate-agent-demo';

  const logEl = document.getElementById('log');
  const startBtn = document.getElementById('start');
  const statusEl = document.getElementById('status');
  const instanceEl = document.getElementById('instance');
  const resultEl = document.getElementById('result-text');

  const LINE_RE = /^\[\+\s*([\d.]+)s\]\s*\[([^\]]+)\]\s*(.*)$/;

  function tagClass(tag) {
    const head = tag.split(':')[0].toLowerCase();
    if (head === 'engine') return 'tag-engine';
    if (head === 'agent-task') return 'tag-agent-task';
    if (head === 'mcp') return 'tag-mcp';
    if (head === 'llm') return 'tag-llm';
    if (head === 'http-tool') return 'tag-http-tool';
    return '';
  }

  function appendLine(raw) {
    const match = raw.match(LINE_RE);
    const div = document.createElement('div');
    div.className = 'line';

    if (match) {
      const [, elapsed, tag, message] = match;
      div.innerHTML =
        '<span class="elapsed">+' + elapsed + 's</span> ' +
        '<span class="tag ' + tagClass(tag) + '">[' + escapeHtml(tag) + ']</span> ' +
        escapeHtml(message);
    } else {
      div.innerHTML = '<span class="plain">' + escapeHtml(raw) + '</span>';
    }

    const atBottom = logEl.scrollHeight - logEl.scrollTop - logEl.clientHeight < 40;
    logEl.appendChild(div);
    if (atBottom) logEl.scrollTop = logEl.scrollHeight;
  }

  function escapeHtml(s) {
    return s.replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
  }

  function setStatus(state) {
    statusEl.textContent = state.toLowerCase();
    statusEl.className = state.toLowerCase();
  }

  new EventSource('/api/logs').onmessage = (event) => appendLine(event.data);

  let pollTimer = null;

  async function pollStatus(processInstanceId) {
    try {
      const res = await fetch('/api/status?processInstanceId=' + encodeURIComponent(processInstanceId));
      const data = await res.json();

      if (data.agentResponse) {
        resultEl.textContent = data.agentResponse;
        resultEl.classList.remove('empty');
      }

      if (data.state === 'COMPLETED') {
        setStatus('completed');
        startBtn.disabled = false;
        clearInterval(pollTimer);
      } else if (data.state === 'INTERNALLY_TERMINATED' || data.state === 'EXTERNALLY_TERMINATED') {
        setStatus('failed');
        startBtn.disabled = false;
        clearInterval(pollTimer);
      }
    } catch (err) {
      // engine unreachable mid-poll; keep trying until the interval is cleared
    }
  }

  startBtn.addEventListener('click', async () => {
    startBtn.disabled = true;
    setStatus('running');
    resultEl.textContent = 'Waiting for agentResponse…';
    resultEl.classList.add('empty');
    instanceEl.textContent = '';

    try {
      const res = await fetch('/api/start', { method: 'POST' });
      const data = await res.json();

      if (!res.ok || !data.id) {
        setStatus('failed');
        resultEl.textContent = data.error || JSON.stringify(data);
        startBtn.disabled = false;
        return;
      }

      instanceEl.textContent = data.id;
      if (pollTimer) clearInterval(pollTimer);
      pollTimer = setInterval(() => pollStatus(data.id), 1000);
    } catch (err) {
      setStatus('failed');
      resultEl.textContent = err.message;
      startBtn.disabled = false;
    }
  });
</script>
</body>
</html>
